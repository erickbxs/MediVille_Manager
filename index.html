<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediVille Manager — Gestão Hospitalar & SUS</title>
    <meta name="description" content="Administre seu hospital e aprenda condutas médicas reais com protocolos do SUS. Protótipo jogável no navegador." />
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="relative w-[100dvw] h-[100dvh] overflow-hidden bg-slate-100 select-none touch-none">
    <!-- Camada de Canvas do PixiJS -->
    <div id="game-canvas-container" class="absolute inset-0 z-0 w-full h-full"></div>

    <!-- Camada de Interface de Usuário (HUD e Menus) -->
    <div id="ui-root" class="pointer-events-none absolute inset-0 z-10 flex flex-col justify-between p-3 sm:p-5" style="padding-top: max(0.75rem, env(safe-area-inset-top)); padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">

      <!-- HUD Superior -->
      <div id="hud-container" class="w-full max-w-5xl mx-auto"></div>

      <!-- Banner de Eventos Ativos -->
      <div id="event-banner-container" class="w-full max-w-xl mx-auto pt-2"></div>

      <!-- Alertas Contextuais (Canto Superior Direito) -->
      <div id="advisor-container" class="absolute top-20 right-4 sm:top-24 sm:right-6 z-20"></div>

      <!-- Dicas de Tutorial e Micro-aprendizado (Canto Inferior Esquerdo) -->
      <div id="tutorial-container" class="absolute bottom-24 sm:bottom-28 left-4 z-30 pointer-events-none"></div>

      <!-- Pilha de Notificações de Emergência (Canto Superior Direito) -->
      <div id="notification-center-container" class="pointer-events-none"></div>

      <!-- Menu Contextual Rápido de Salas Existentes -->
      <div id="room-context-container" class="pointer-events-auto"></div>

      <!-- Barra Flutuante de Confirmação (Build Confirm Bar) -->
      <div id="build-confirm-container" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-40 pointer-events-auto"></div>

      <!-- Barra de Construção Inferior -->
      <div id="build-menu-container" class="w-full flex justify-center pb-1"></div>
    </div>

    <!-- Modais e Telas de Decisão -->
    <div id="modal-container" class="pointer-events-auto"></div>

    <!-- Tela Inicial Interativa (Main Menu) -->
    <div id="title-screen-container" class="pointer-events-auto"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
